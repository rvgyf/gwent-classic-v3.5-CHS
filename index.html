<audio id="bgMusicLocal"></audio>

<script>
    var playlist = [
        "audio/track1.mp3", "audio/track2.mp3", "audio/track3.mp3", "audio/track4.mp3",
        "audio/track5.mp3", "audio/track6.mp3", "audio/track7.mp3", "audio/track8.mp3",
        "audio/track9.mp3", "audio/track10.mp3", "audio/track11.mp3", "audio/track12.mp3", "audio/track13.mp3"
    ];
    var audio = document.getElementById('bgMusicLocal');

   var currentTrackIndex = -1;

    function saltar() {
        if (playlist.length <= 1) {
            if (playlist.length === 1) {
                audio.src = playlist[0];
                audio.play().catch(e => console.log("等待用户交互..."));
            }
            return;
        }

        var nuevoIndex = currentTrackIndex;

        while (nuevoIndex === currentTrackIndex) {
            nuevoIndex = Math.floor(Math.random() * playlist.length);
        }
        
        currentTrackIndex = nuevoIndex;
        var track = playlist[currentTrackIndex];
        
        audio.src = track;
        audio.play().catch(e => console.log("等待用户交互..."));
    }

    // Play/Pause 按钮（♫）的逻辑
    document.getElementById('btn-play').onclick = function(e) {
        e.stopPropagation();
        if (!audio.src || audio.src === "") { saltar(); } 
        else { (audio.paused) ? audio.play() : audio.pause(); }
    };

    // 下一首按钮（⏭）的逻辑 - 保证切换到全新曲目
    document.getElementById('btn-skip').onclick = function(e) {
        e.stopPropagation();
        saltar();
    };

    // 自然播放结束后，随机切换到另一首
    audio.onended = function() { saltar(); };
   
    function iniciarAlTocar() {
        if (!audio.src || audio.src === "") { saltar(); }
        window.removeEventListener('click', iniciarAlTocar);
        window.removeEventListener('touchstart', iniciarAlTocar);
    }
    window.addEventListener('click', iniciarAlTocar);
    window.addEventListener('touchstart', iniciarAlTocar);
 document.addEventListener("visibilitychange", function() {
        if (audio && audio.src && audio.src !== "") {
            if (document.hidden) {
                audio._fuePausadoPorSistema = !audio.paused;
                audio.pause();
            } else {
                if (audio._fuePausadoPorSistema) {
                    audio.play().catch(function(e) { console.log("硬件拦截已规避"); });
                }
            }
        }
    });
</script>
